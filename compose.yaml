services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run local:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run local:env}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run local:env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
