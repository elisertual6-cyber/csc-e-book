name: Activate free timed mock examinations
on:
  push:
    branches: [main]
    paths: [content/releases/timed-mocks.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-migrations-main
  cancel-in-progress: false
jobs:
  activate:
    name: Release two free draft mocks with 160 questions and 150 minutes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate fixed source and existing database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          set -e
          npm run content:check
          npm run db:check-schema
      - name: Activate only the two fixed free timed mock sessions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" || -z "$ADMIN_EMAIL" ]]; then
            echo "Configure the existing DATABASE_MIGRATION_URL and ADMIN_BOOTSTRAP_EMAIL secrets."
            exit 1
          fi
          npm run practice:activate-timed-mocks -- --apply
      - name: Verify the updated practice page is live
        run: node scripts/check-timed-mock-deployment.mjs
