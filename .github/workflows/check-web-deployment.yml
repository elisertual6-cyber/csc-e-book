name: Verify web deployment
on:
  push:
    branches: [main]
    paths: [src/components/exam-player.tsx]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
jobs:
  verify:
    name: Require successful Vercel deployment for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Read deployment status without changing accounts or data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { setTimeout } from 'node:timers/promises';
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/status`;
          for (let attempt = 0; attempt < 24; attempt++) {
            try {
              const response = await fetch(url, {
                headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
                redirect: 'error', signal: AbortSignal.timeout(10000),
              });
              if (response.ok) {
                const data = await response.json();
                const vercel = data.statuses?.find(status => /vercel/i.test(status.context));
                if (vercel?.state === 'success') { console.log('Vercel successfully deployed this commit.'); process.exit(0); }
                if (['failure', 'error'].includes(vercel?.state)) { console.error('Vercel reported a deployment failure. Check its build dashboard.'); process.exit(1); }
              }
            } catch { /* Retry bounded read failures without logging private responses. */ }
            await setTimeout(10000);
          }
          console.error('Vercel deployment success was not confirmed within the rollout window.');
          process.exit(1);
          JS
